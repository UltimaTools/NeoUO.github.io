name: AutoDoc API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'update-feed-alpha-net472.json'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write

jobs:
  rebuild_docs:
    runs-on: windows-latest
    
    steps:
    - name: Checkout website repo
      uses: actions/checkout@v4
      with:
        path: website_repo
    
    - name: Get latest version information
      id: get_version
      run: |
        $feedPath = "website_repo/update-feed-alpha-net472.json"
        $feed = Get-Content -Path $feedPath | ConvertFrom-Json
        $version = $feed.version
        $tag = $feed.tag
        $baseUrl = $feed.baseUrl
        $portableUrl = "$baseUrl" + "neouo-net472-alpha-Portable.zip"
        Write-Host "Latest version: $version"
        Write-Host "Portable URL: $portableUrl"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "portable_url=$portableUrl" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Download portable zip
      run: |
        Invoke-WebRequest -Uri "${{ steps.get_version.outputs.portable_url }}" -OutFile "neouo-portable.zip"
      shell: pwsh

    - name: Extract portable zip
      run: |
        New-Item -ItemType Directory -Path "extracted" -Force
        7z x neouo-portable.zip -o"./extracted"
        Write-Host "Extracted contents:"
        Get-ChildItem extracted -Recurse -Depth 2 -Name
      shell: pwsh

    - name: Run --autoDocsOnly
      run: |
        cd extracted\current
        Write-Host "Running from: $(Get-Location)"
        .\neouo-net472.exe --autoDocsOnly
        Get-ChildItem Config\AutoComplete.json -ErrorAction Stop
      shell: pwsh

    - name: Run autodoc.py
      run: |
        cd extracted\current
        Copy-Item "${{ github.workspace }}\website_repo\doc\autodoc.py" -Destination "." -Force
        python autodoc.py .\Config\AutoComplete.json
      shell: pwsh

    - name: Update repo documentation
      run: |
        Copy-Item -Path "extracted\current\wiki\*" -Destination "website_repo\doc\wiki\" -Recurse -Force -Verbose
      shell: pwsh

    - name: Commit
      run: |
        cd website_repo
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add doc/
        git commit -m "GitHub Actions build_docs" || echo "No changes to commit"
      shell: pwsh

    - name: Push changes
      run: |
        cd website_repo
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        for ($i = 1; $i -le 3; $i++) {
          git pull --rebase origin main
          if (git push origin main) { break }
          Write-Host "Push failed, retrying ($i/3)..."
          Start-Sleep -Seconds 5
        }
      shell: pwsh
