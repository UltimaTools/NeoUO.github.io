name: AutoDoc API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'update-feed-alpha-net472.json'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write

jobs:
  rebuild_docs:
    runs-on: windows-latest
    
    steps:
    - name: Checkout website repo
      uses: actions/checkout@v4
      with:
        path: website_repo
    
    - name: Get latest version information
      id: get_version
      run: |
        $feedPath = "website_repo/update-feed-alpha-net472.json"
        $feed = Get-Content -Path $feedPath | ConvertFrom-Json
        $version = $feed.version
        $baseUrl = $feed.baseUrl
        Write-Host "Latest version: $version"
        $jsonUrl = "$baseUrl" + "AutoComplete.json"
        Write-Host "JSON URL: $jsonUrl"
        echo "json_url=$jsonUrl" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Download AutoComplete.json
      run: |
        New-Item -ItemType Directory -Path "work" -Force
        Invoke-WebRequest -Uri "${{ steps.get_version.outputs.json_url }}" -OutFile "work\AutoComplete.json"
        Get-ChildItem work\AutoComplete.json
      shell: pwsh

    - name: Run autodoc.py
      run: |
        cd work
        Copy-Item "${{ github.workspace }}\website_repo\doc\autodoc.py" -Destination "." -Force
        python autodoc.py .\AutoComplete.json
      shell: pwsh

    - name: Update repo documentation
      run: |
        if (Test-Path "work\wiki") {
          Copy-Item -Path "work\wiki\*" -Destination "website_repo\doc\wiki\" -Recurse -Force -Verbose
        } else {
          Get-ChildItem work -Recurse -Name
          Write-Error "Wiki output not found in work\wiki"
          exit 1
        }
      shell: pwsh

    - name: Commit
      run: |
        cd website_repo
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add doc/
        git commit -m "GitHub Actions build_docs" || echo "No changes to commit"
      shell: pwsh

    - name: Push changes
      run: |
        cd website_repo
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        for ($i = 1; $i -le 3; $i++) {
          git pull --rebase origin main
          if (git push origin main) { break }
          Write-Host "Push failed, retrying ($i/3)..."
          Start-Sleep -Seconds 5
        }
      shell: pwsh
