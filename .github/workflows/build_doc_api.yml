name: AutoDoc API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'update-feed-alpha-net472.json'
      - 'AutoComplete.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write

jobs:
  rebuild_docs:
    runs-on: windows-latest
    
    steps:
    - name: Checkout website repo
      uses: actions/checkout@v4
      with:
        path: website_repo
    
    - name: Get latest version information
      id: get_version
      run: |
        $feedPath = "website_repo/update-feed-alpha-net472.json"
        $feed = Get-Content -Path $feedPath | ConvertFrom-Json
        $version = $feed.version
        Write-Host "Latest version: $version"
      shell: pwsh

    - name: Run autodoc.py
      run: |
        cd website_repo
        $jsonPath = Join-Path (Get-Location) "AutoComplete.json"
        Write-Host "JSON path: $jsonPath"
        Get-ChildItem $jsonPath -ErrorAction Stop
        Copy-Item "doc\autodoc.py" -Destination "." -Force
        python autodoc.py $jsonPath
      shell: pwsh

    - name: Update repo documentation
      run: |
        if (Test-Path "website_repo\wiki") {
          Copy-Item -Path "website_repo\wiki\*" -Destination "website_repo\doc\wiki\" -Recurse -Force -Verbose
        } else {
          Write-Error "Wiki output not found"
          exit 1
        }
      shell: pwsh

    - name: Commit
      run: |
        cd website_repo
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add doc/
        git commit -m "GitHub Actions build_docs" || echo "No changes to commit"
      shell: pwsh

    - name: Push changes
      run: |
        cd website_repo
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        for ($i = 1; $i -le 3; $i++) {
          git pull --rebase origin main
          if (git push origin main) { break }
          Write-Host "Push failed, retrying ($i/3)..."
          Start-Sleep -Seconds 5
        }
      shell: pwsh
